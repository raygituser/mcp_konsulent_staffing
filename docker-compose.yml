services:
  konsulent_api:
    build:
      context: ./konsulent_api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  llm_verktoy_api:
    build:
      context: ./llm_verktoy_api
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
    volumes:
      - ./models:/models:ro
    depends_on:
      - konsulent_api

  # Local GGUF via llama.cpp server (optional)
  llama_cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["local-gguf"]
    volumes:
      - ./models:/models:ro
    command: >
      --host 0.0.0.0
      --port 8080
      --model ${LOCAL_MODEL_PATH:-/models/model.gguf}
      --ctx-size 2048
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://localhost:8080/v1/models >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis (optional)
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Observability (optional)
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability","obs"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - konsulent_api
      - llm_verktoy_api

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability","obs"]
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false


  # Reverse proxy (optional)
  nginx:
    image: nginx:alpine
    profiles: ["edge"]
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - konsulent_api
      - llm_verktoy_api

volumes:
  grafana_data:
