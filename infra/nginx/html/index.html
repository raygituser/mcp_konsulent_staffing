<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsulent Staffing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .container { width: 100%; max-width: 500px; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 2px solid #3b82f6; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.875rem; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #f1f5f9; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .btn { display: block; width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        .btn:hover { background: #2563eb; }
        #result { margin-top: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; display: none; max-height: 300px; overflow-y: auto; }
        #result.show { display: block; }
        #result pre { font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
        .monitoring { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .monitoring a { flex: 1; display: block; padding: 0.75rem; background: #334155; color: #f1f5f9; text-decoration: none; border-radius: 8px; text-align: center; font-size: 0.9rem; }
        .monitoring a:hover { background: #475569; }
        .monitoring .grafana { background: #f46800; }
        .monitoring .grafana:hover { background: #d45a00; }
        .monitoring .prometheus { background: #e6522c; }
        .monitoring .prometheus:hover { background: #c44424; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Søk etter konsulenter</h1>
        <div class="card">
            <form id="searchForm">
                <div class="form-group">
                    <label>Min. Tilgjengelighet (%)</label>
                    <input type="number" id="minTilgj" value="50" min="0" max="100">
                </div>
                <div class="form-group">
                    <label>Påkrevd Ferdighet</label>
                    <input type="text" id="ferdighet" value="Python" placeholder="f.eks. Python, React, Azure">
                </div>
                <button type="submit" class="btn">Søk</button>
            </form>
            <div id="result"><pre id="resultText"></pre></div>
        </div>
        <div class="monitoring">
            <a href="http://localhost:3000" target="_blank" class="grafana">Grafana</a>
            <a href="http://localhost:9090" target="_blank" class="prometheus">Prometheus</a>
        </div>
    </div>
    <script>
        document.getElementById("searchForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const min = document.getElementById("minTilgj").value;
            const skill = document.getElementById("ferdighet").value;
            const result = document.getElementById("result");
            const resultText = document.getElementById("resultText");
            result.classList.add("show");
            resultText.textContent = "Søker...";
            try {
                const url = "/sok?min_tilgjengelighet_prosent=" + encodeURIComponent(min) + "&påkrevd_ferdighet=" + encodeURIComponent(skill);
                const resp = await fetch(url);
                const data = await resp.json();
                resultText.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                resultText.textContent = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
