events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Longer timeouts for LLM calls
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    server {
        listen 8080;
        server_name localhost;

        # Dashboard - serve static HTML
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # =====================================================
        # MAIN ENDPOINT: /sok with two parameters
        # Usage: /sok?min_tilgjengelighet_prosent=50&påkrevd_ferdighet=Python
        # =====================================================
        location = /sok {
            proxy_pass http://llm_verktoy_api:8000/tilgjengelige-konsulenter/sammendrag$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # =====================================================
        # NEW API ROUTES (cleaner paths)
        # =====================================================
        location = /api/konsulenter {
            proxy_pass http://konsulent_api:8000/konsulenter;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/sammendrag {
            proxy_pass http://llm_verktoy_api:8000/tilgjengelige-konsulenter/sammendrag$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /api/audit {
            proxy_pass http://llm_verktoy_api:8000/audit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/openrouter/ {
            proxy_pass http://llm_verktoy_api:8000/openrouter/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # =====================================================
        # HEALTH & METRICS
        # =====================================================
        location = /health {
            proxy_pass http://llm_verktoy_api:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /health/konsulent {
            proxy_pass http://konsulent_api:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /health/llm {
            proxy_pass http://llm_verktoy_api:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /metrics/konsulent {
            proxy_pass http://konsulent_api:8000/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /metrics/llm {
            proxy_pass http://llm_verktoy_api:8000/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # =====================================================
        # LEGACY ROUTES (your original endpoints - unchanged)
        # =====================================================
        location /konsulenter {
            proxy_pass http://konsulent_api:8000/konsulenter;
        }

        location /tilgjengelige-konsulenter/ {
            proxy_pass http://llm_verktoy_api:8000/tilgjengelige-konsulenter/;
        }
    }
}
